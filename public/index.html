<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>VOLT Robot Control</title><style>
:root{color-scheme:dark;--bg:#080d16;--panel:#111b2b;--line:#26384f;--mint:#45ffc1;--muted:#9cafc7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#17243a,var(--bg) 65%);color:#edf5ff;font-family:system-ui,Arial,sans-serif}header{text-align:center;padding:24px 12px;border-bottom:1px solid var(--line);background:#0c1422dd}h1{margin:0;color:var(--mint);letter-spacing:4px;font-size:clamp(24px,5vw,36px)}header p{margin:8px 0 0;color:var(--muted);font-size:12px;letter-spacing:2px}main{max-width:580px;margin:auto;padding:20px}.status{border:1px solid var(--line);background:var(--panel);padding:12px;border-radius:12px;display:flex;justify-content:space-between;gap:10px;font-size:13px}.pill{border-radius:20px;padding:5px 10px;background:#50222b;color:#ff9eaa}.pill.on{background:#123c32;color:var(--mint)}h2{text-align:center;font-size:14px;letter-spacing:2px;margin:24px 0 8px}.pad{position:relative;width:min(78vw,300px);height:min(78vw,300px);margin:20px auto;border-radius:50%;border:2px solid var(--mint);background:radial-gradient(circle,#253d57,#111b2b 70%);touch-action:none;user-select:none;box-shadow:0 0 30px #45ffc11a}.pad:before,.pad:after{content:"";position:absolute;background:#496078}.pad:before{width:1px;height:100%;left:50%}.pad:after{height:1px;width:100%;top:50%;left:0}.label{position:absolute;color:#a9bdd4;font-size:10px;font-weight:800;letter-spacing:1px}.up{top:15px;left:50%;transform:translateX(-50%)}.down{bottom:15px;left:50%;transform:translateX(-50%)}.left{left:12px;top:50%;transform:translateY(-50%)}.right{right:12px;top:50%;transform:translateY(-50%)}.knob{position:absolute;left:50%;top:50%;width:78px;height:78px;border-radius:50%;transform:translate(-50%,-50%);background:var(--mint);border:4px solid #dffff5;box-shadow:0 0 24px #45ffc166;pointer-events:none}.card{padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:14px}.speedhead{display:flex;justify-content:space-between;margin-bottom:12px;font-size:14px}input{width:100%;accent-color:var(--mint)}.buttons{display:flex;gap:12px;margin-top:14px}button{flex:1;border:0;border-radius:10px;padding:15px 8px;font-weight:800;cursor:pointer}.stop{background:#ff4059;color:white}.center{background:#263b55;color:white}.hint{text-align:center;color:var(--muted);font-size:12px;line-height:1.7;margin:18px 4px}footer{text-align:center;color:#637892;font-size:11px;padding:20px}</style></head><body>
<header><h1>VOLT ROBOT</h1><p>CLOUD-LINKED ROBOT CONTROL</p></header><main><div class="status"><span id="statusText">Connecting to backend…</span><span id="pill" class="pill">OFFLINE</span></div><h2>VIRTUAL JOYSTICK</h2><div class="pad" id="pad"><span class="label up">FORWARD</span><span class="label down">REVERSE</span><span class="label left">LEFT</span><span class="label right">RIGHT</span><div class="knob" id="knob"></div></div><div class="card"><div class="speedhead"><span>MOTOR SPEED</span><strong><span id="speedText">160</span> / 255</strong></div><input id="speed" type="range" min="0" max="255" value="160"></div><div class="buttons"><button class="center" id="center">CENTER / STOP</button><button class="stop" id="stop">EMERGENCY STOP</button></div><p class="hint">Hold and move the joystick to drive. Release to stop.<br>Both the webpage and ESP32 need internet access.</p></main><footer>VOLT • ESP32 WEBSOCKET CONTROL</footer>
<script>
const pad=document.getElementById('pad'),knob=document.getElementById('knob'),speed=document.getElementById('speed'),statusText=document.getElementById('statusText'),pill=document.getElementById('pill');let socket=null,active=false,pointer=null,x=0,y=0;
function status(on,msg){pill.textContent=on?'CONNECTED':'OFFLINE';pill.className=on?'pill on':'pill';statusText.textContent=msg||(on?'ESP32 connected':'Waiting for ESP32')}
function connect(){socket=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/');socket.onopen=()=>status(false,'Website connected; checking ESP32…');socket.onmessage=e=>{try{let m=JSON.parse(e.data);if(m.type==='robot_status')status(!!m.connected,m.connected?'ESP32 connected':'Website online; ESP32 offline')}catch{}};socket.onclose=()=>{status(false,'Backend disconnected; reconnecting…');setTimeout(connect,1500)};socket.onerror=()=>status(false,'Backend connection error')}
function send(o){if(socket&&socket.readyState===WebSocket.OPEN)socket.send(JSON.stringify(o))}function move(){if(active)send({type:'move',x:Math.round(x),y:Math.round(y),speed:+speed.value})}function stop(){active=false;pointer=null;x=0;y=0;knob.style.left='50%';knob.style.top='50%';send({type:'stop'})}
function update(e){let r=pad.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,rad=r.width*.35,d=Math.hypot(dx,dy);if(d>rad){dx*=rad/d;dy*=rad/d}knob.style.left=(50+dx/r.width*100)+'%';knob.style.top=(50+dy/r.height*100)+'%';x=Math.max(-100,Math.min(100,dx/rad*100));y=Math.max(-100,Math.min(100,-dy/rad*100));if(Math.abs(x)<8)x=0;if(Math.abs(y)<8)y=0;move()}
pad.onpointerdown=e=>{e.preventDefault();active=true;pointer=e.pointerId;pad.setPointerCapture(pointer);update(e)};pad.onpointermove=e=>{if(active&&e.pointerId===pointer)update(e)};pad.onpointerup=e=>{if(active&&e.pointerId===pointer)stop()};pad.onpointercancel=stop;window.onblur=()=>{if(active)stop()};document.getElementById('stop').onclick=stop;document.getElementById('center').onclick=stop;speed.oninput=()=>{document.getElementById('speedText').textContent=speed.value;move()};setInterval(()=>{if(active)move()},150);connect();
</script></body></html>
